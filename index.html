<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RCN RM Test EFF. Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 12px;
      background: linear-gradient(180deg, #fff7fb, #ffeef6);
      font-size: 18px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 6px 18px rgba(255,182,217,0.18);
    }

    h2 {
      text-align: center;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #ff69b4;
    }

    .warning {
      margin-top: 0;
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #fff0f3;
      color: #e11d48;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
      border: 2px dashed #ff8fab;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 22px;
      color: #202124;
      font-size: 18px;
      line-height: 1.5;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #ffd1e6;
      font-size: 18px;
      line-height: 1.4;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input[readonly] {
      background: #fff7fb;
    }

    .toggle-box {
      margin-top: 6px;
      display: grid;
      gap: 4px;
    }

    .toggle-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid #ffd1e6;
      border-radius: 12px;
      background: white;
      font-size: 17px;
      line-height: 1.3;
      color: #202124;
      cursor: pointer;
    }

    .toggle-option input {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      margin: 0;
    }

    button {
      background: #ffb6d9;
      color: white;
      border: none;
      margin-top: 28px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 999px;
      font-size: 20px;
      padding: 16px;
      box-shadow: 0 10px 22px rgba(255,143,199,0.35);
      transition: all 0.25s ease;
    }

    button:hover {
      background: #ff8fc7;
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .hint {
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff7fb;
      color: #555;
      font-size: 15px;
      border: 1px dashed #ffd1e6;
    }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: linear-gradient(135deg, #ffb6d9, #ff8fc7);
      color: white;
      padding: 22px 34px;
      border-radius: 24px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 16px 40px rgba(255,105,180,0.35);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 9999;
    }

    .popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
        font-size: 19px;
      }

      .card {
        padding: 16px;
        border-radius: 14px;
      }

      h2 {
        font-size: 23px;
      }

      label {
        font-size: 19px;
      }

      input,
      select,
      textarea,
      button,
      .toggle-option {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <div class="card">

    <h2>✨💖 RCN RM Test EFF. Form 💖✨</h2>

    <div class="warning">
      🚨 เอกสารภายใน<br>
      ห้ามส่งลิงก์ให้ภายนอก !!!
    </div>

    <label>เลือกชื่อผู้ทดลอง*</label>
    <select id="testerName" onchange="loadProducts()"></select>

    <label>1. เลือกสินค้า (รอสักครู่ชื่อสินค้าจะขึ้นให้เลือก) *</label>
    <div id="sampleName" class="toggle-box"></div>

    <label>วันที่แจกตัวอย่าง (ไม่ต้องกรอก)</label>
    <input type="text" id="sampleDate" readonly>

    <label>2. ซ้าย : ความรู้สึกขณะใช้</label>
    <textarea id="leftFeeling"></textarea>

    <label>3. ขวา : ความรู้สึกขณะใช้</label>
    <textarea id="rightFeeling"></textarea>

    <label>4. ซ้าย-ขวาเหมือนกันหรือไม่*</label>
    <div id="sameOrNot" class="toggle-box"></div>

    <label>4.1 อธิบายเหตุผลที่เลือกข้อ 4</label>
    <textarea id="sameReason"></textarea>

    <label>5. เลือกข้างที่ชอบ*</label>
    <div id="favoriteSide" class="toggle-box"></div>

    <label>5.1 อธิบายเหตุผลที่เลือกข้อ 5</label>
    <textarea id="favoriteReason"></textarea>

    <button id="submitBtn" onclick="submitForm()">🎀 บันทึกข้อมูล 🎀</button>
  </div>

  <div id="popup" class="popup"></div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbyXwlyASsPm67LEC8F4waEFdfutU8P-gzIOpagtZJLJFtw9zTyMnEFbxEvYXNGAzZfK/exec";

    let productData = [];

    window.onload = function () {
      loadTesterNames();
      loadQuestion4List();
      loadQuestion5List();
    };

    async function apiGet(action, params = {}) {
      const url = new URL(API_URL);

      url.searchParams.append("action", action);

      Object.keys(params).forEach(function(key) {
        url.searchParams.append(key, params[key]);
      });

      const response = await fetch(url.toString());

      if (!response.ok) {
        throw new Error("API GET error: " + response.status);
      }

      return await response.json();
    }

    async function apiPost(action, data) {
      const response = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: action,
          data: data
        })
      });

      if (!response.ok) {
        throw new Error("API POST error: " + response.status);
      }

      return await response.json();
    }

    async function loadTesterNames() {
      const select = document.getElementById("testerName");

      select.innerHTML = "";

      const loading = document.createElement("option");
      loading.value = "";
      loading.textContent = "กำลังโหลดรายชื่อ...";
      select.appendChild(loading);

      try {
        const names = await apiGet("getTesterNames");

        select.innerHTML = "";

        const blank = document.createElement("option");
        blank.value = "";
        blank.textContent = "-- เลือกชื่อผู้ทดลอง --";
        select.appendChild(blank);

        if (!Array.isArray(names) || names.length === 0) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "ไม่พบรายชื่อผู้ทดลอง";
          select.appendChild(option);
          return;
        }

        names.forEach(function(name) {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          select.appendChild(option);
        });

      } catch (error) {
        console.error(error);

        select.innerHTML = "";

        const option = document.createElement("option");
        option.value = "";
        option.textContent = "โหลดรายชื่อไม่สำเร็จ";
        select.appendChild(option);
      }
    }

    async function loadProducts() {
      const testerName = document.getElementById("testerName").value;
      const sampleContainer = document.getElementById("sampleName");

      sampleContainer.innerHTML = "";
      document.getElementById("sampleDate").value = "";
      productData = [];

      if (!testerName) {
        sampleContainer.innerHTML =
          '<div class="hint">กรุณาเลือกชื่อผู้ทดลองก่อน</div>';
        return;
      }

      sampleContainer.innerHTML =
        '<div class="hint">กำลังโหลดสินค้า...</div>';

      try {
        const products = await apiGet("getProductsByTester", {
          testerName: testerName
        });

        productData = Array.isArray(products) ? products : [];

        sampleContainer.innerHTML = "";

        if (productData.length === 0) {
          sampleContainer.innerHTML =
            '<div class="hint">ไม่พบสินค้า กรุณาตรวจสอบ Tester_List และ List!A2</div>';
          return;
        }

        productData.forEach(function(item) {
          const testerId = String(item.testerId || "").trim();
          const sampleName = String(item.sampleName || "").trim();
          const sampleDate = String(item.sampleDate || "").trim();

          const label = document.createElement("label");
          label.className = "toggle-option";

          const input = document.createElement("input");
          input.type = "radio";
          input.name = "sampleName";
          input.value = testerId;

          input.dataset.testerId = testerId;
          input.dataset.sampleName = sampleName;
          input.dataset.sampleDate = sampleDate;

          input.onchange = setDate;

          const span = document.createElement("span");

          if (testerId && sampleName) {
            span.textContent = testerId + " | " + sampleName;
          } else if (sampleName) {
            span.textContent = sampleName;
          } else if (testerId) {
            span.textContent = testerId;
          } else {
            span.textContent = "(ไม่มีชื่อสินค้า)";
          }

          label.appendChild(input);
          label.appendChild(span);
          sampleContainer.appendChild(label);
        });

      } catch (error) {
        console.error(error);

        sampleContainer.innerHTML =
          '<div class="hint">โหลดสินค้าไม่สำเร็จ กรุณาตรวจสอบ API_URL หรือ Deploy Apps Script</div>';
      }
    }

    function setDate() {
      const selected =
        document.querySelector('input[name="sampleName"]:checked');

      if (!selected) {
        document.getElementById("sampleDate").value = "";
        return;
      }

      const selectedId =
        String(selected.value || "").trim();

      const found =
        productData.find(function(item) {
          return String(item.testerId || "").trim() === selectedId;
        });

      const dateFromRadio =
        selected.dataset.sampleDate || "";

      const dateFromData =
        found ? String(found.sampleDate || "").trim() : "";

      document.getElementById("sampleDate").value =
        dateFromRadio || dateFromData || "";
    }

    async function loadQuestion4List() {
      try {
        const list = await apiGet("getQuestion4List");
        fillToggle("sameOrNot", list, "sameOrNot");
      } catch (error) {
        console.error(error);
        document.getElementById("sameOrNot").innerHTML =
          '<div class="hint">โหลดตัวเลือกข้อ 4 ไม่สำเร็จ</div>';
      }
    }

    async function loadQuestion5List() {
      try {
        const list = await apiGet("getQuestion5List");
        fillToggle("favoriteSide", list, "favoriteSide");
      } catch (error) {
        console.error(error);
        document.getElementById("favoriteSide").innerHTML =
          '<div class="hint">โหลดตัวเลือกข้อ 5 ไม่สำเร็จ</div>';
      }
    }

    function fillToggle(elementId, list, name) {
      const container = document.getElementById(elementId);

      container.innerHTML = "";

      if (!Array.isArray(list) || list.length === 0) {
        container.innerHTML =
          '<div class="hint">ไม่พบตัวเลือก</div>';
        return;
      }

      list.forEach(function(item) {
        const label = document.createElement("label");
        label.className = "toggle-option";

        const input = document.createElement("input");
        input.type = "radio";
        input.name = name;
        input.value = item;

        const span = document.createElement("span");
        span.textContent = item;

        label.appendChild(input);
        label.appendChild(span);
        container.appendChild(label);
      });
    }

    function showPopup(message) {
      const popup = document.getElementById("popup");

      popup.innerText = message;
      popup.classList.add("show");

      setTimeout(function() {
        popup.classList.remove("show");
      }, 2500);
    }

    async function submitForm() {
      const button = document.getElementById("submitBtn");

      const selectedRadio =
        document.querySelector('input[name="sampleName"]:checked');

      const selectedId =
        selectedRadio ? String(selectedRadio.value || "").trim() : "";

      const found =
        productData.find(function(item) {
          return String(item.testerId || "").trim() === selectedId;
        });

      const sameOrNot =
        document.querySelector('input[name="sameOrNot"]:checked')
          ? document.querySelector('input[name="sameOrNot"]:checked').value
          : "";

      const favoriteSide =
        document.querySelector('input[name="favoriteSide"]:checked')
          ? document.querySelector('input[name="favoriteSide"]:checked').value
          : "";

      if (!selectedId) {
        alert("⚠️ กรุณาเลือกสินค้า");
        return;
      }

      if (!sameOrNot) {
        alert("⚠️ กรุณาตอบข้อ 4");
        return;
      }

      if (!favoriteSide) {
        alert("⚠️ กรุณาตอบข้อ 5");
        return;
      }

      const selectedText =
        selectedRadio && selectedRadio.closest("label")
          ? selectedRadio.closest("label").innerText.trim()
          : "";

      const sampleNameFromRadio =
        selectedRadio
          ? String(selectedRadio.dataset.sampleName || "").trim()
          : "";

      const sampleDateFromRadio =
        selectedRadio
          ? String(selectedRadio.dataset.sampleDate || "").trim()
          : "";

      const sampleNameForSheet =
        sampleNameFromRadio ||
        (found ? String(found.sampleName || "").trim() : "") ||
        selectedText ||
        selectedId;

      const sampleDateForSheet =
        sampleDateFromRadio ||
        document.getElementById("sampleDate").value;

      const data = {
        testerName: document.getElementById("testerName").value,
        sampleId: selectedId,
        sampleName: sampleNameForSheet,
        sampleDate: sampleDateForSheet,
        leftFeeling: document.getElementById("leftFeeling").value,
        rightFeeling: document.getElementById("rightFeeling").value,
        sameOrNot: sameOrNot,
        sameReason: document.getElementById("sameReason").value,
        favoriteSide: favoriteSide,
        favoriteReason: document.getElementById("favoriteReason").value
      };

      try {
        button.disabled = true;
        button.textContent = "กำลังบันทึก...";

        const result = await apiPost("saveResponse", data);

        if (!result || result.status !== "success") {
          alert("บันทึกไม่สำเร็จ กรุณาลองใหม่");
          console.log(result);
          return;
        }

        showPopup("🎀 ขอบคุณค่า " + data.testerName + " 💖");

        clearForm();

      } catch (error) {
        console.error(error);
        alert("บันทึกไม่สำเร็จ กรุณาตรวจสอบ Apps Script / API_URL");

      } finally {
        button.disabled = false;
        button.textContent = "🎀 บันทึกข้อมูล 🎀";
      }
    }

    function clearForm() {
      document.getElementById("testerName").value = "";
      document.getElementById("sampleName").innerHTML = "";
      document.getElementById("sampleDate").value = "";
      document.getElementById("leftFeeling").value = "";
      document.getElementById("rightFeeling").value = "";
      document.getElementById("sameReason").value = "";
      document.getElementById("favoriteReason").value = "";

      document.querySelectorAll('input[name="sameOrNot"]').forEach(function(el) {
        el.checked = false;
      });

      document.querySelectorAll('input[name="favoriteSide"]').forEach(function(el) {
        el.checked = false;
      });

      productData = [];
    }
  </script>
</body>
</html>
